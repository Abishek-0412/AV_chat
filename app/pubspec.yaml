name: av_chat
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  av_protocol:
    path: ../packages/av_protocol
  collection: ^1.19.1
  crypto: ^3.0.7
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_foreground_task: ^10.0.0
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_webrtc: ^1.6.2+hotfix.4
  go_router: ^17.5.0
  image_picker: ^1.2.3
  just_audio: ^0.10.6
  livekit_client: ^2.13.1
  local_auth: ^3.0.2
  meta: ^1.17.0
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  permission_handler: ^11.4.0
  qr_flutter: ^4.1.0
  record: ^6.2.1
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/icon/icon_full.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon_full.png
  adaptive_icon_background: assets/icon/icon_background.png
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_foreground.png
  min_sdk_android: 24
